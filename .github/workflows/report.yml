name: market report

# Manual only. No schedule. The report runs when you press Run workflow,
# or when something calls the workflow_dispatch API, such as a phone
# shortcut or an external scheduler.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: system libraries for PDF rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - run: pip install yfinance mplfinance feedparser pandas matplotlib requests weasyprint

      - name: run report
        run: python market_report.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOLDINGS_CSV_URL: ${{ secrets.HOLDINGS_CSV_URL }}

      - name: remember this report
        run: |
          git config user.name "market report"
          git config user.email "actions@github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "state $(date -u +%F-%H%M)"
          git push || true
