name: market report

on:
  schedule:
    - cron: '0 14 * * 1-5'
    - cron: '30 16 * * 1-5'
    - cron: '0 19 * * 1-5'
    - cron: '0 15 * * 1-5'
    - cron: '30 17 * * 1-5'
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance mplfinance feedparser pandas matplotlib requests
      - name: run report
        run: python market_report.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
