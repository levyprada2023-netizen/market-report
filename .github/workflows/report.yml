name: market report

# Manual only. No schedule. Press Run workflow, optionally type a question,
# and the report comes back with an answer to it at the top.
on:
  workflow_dispatch:
    inputs:
      question:
        description: 'Ask anything (optional). e.g. Why did GOOG drop so much today?'
        required: false
        type: string
      tickers:
        description: 'Tickers to dig into (optional, comma separated). e.g. GOOG, MU, RGTI'
        required: false
        type: string
      depth:
        description: 'How deep should the answer go?'
        required: false
        default: 'normal'
        type: choice
        options:
          - short
          - normal
          - deep

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: system libraries for PDF rendering
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - run: pip install yfinance mplfinance feedparser pandas matplotlib requests weasyprint

      - name: run report
        run: python market_report.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HOLDINGS_CSV_URL: ${{ secrets.HOLDINGS_CSV_URL }}
          REPORT_QUESTION: ${{ inputs.question }}
          REPORT_TICKERS: ${{ inputs.tickers }}
          REPORT_DEPTH: ${{ inputs.depth }}

      - name: remember this report
        run: |
          git config user.name "market report"
          git config user.email "actions@github.com"
          git add state.json || true
          git diff --staged --quiet || git commit -m "state $(date -u +%F-%H%M)"
          git push || true
